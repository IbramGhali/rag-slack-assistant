# Paste into https://api.slack.com/apps -> Create New App -> From an app manifest.
display_information:
  name: Policy Assistant
  description: Answers staff questions from company policies, with sources.
features:
  bot_user:
    display_name: policy-assistant
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
      - im:read
      - im:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
