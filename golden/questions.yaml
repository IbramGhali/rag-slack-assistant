# Golden evaluation set: 60 questions written by hand against the synthetic corpus.
#   direct       (20) wording close to the policy text
#   paraphrase   (20) same facts, different wording
#   unanswerable (10) not covered by any policy: the assistant must refuse
#   superseded   (10) the fact changed; the answer must come from the current policy
# answer_contains: every string must appear in the answer (case-insensitive).

