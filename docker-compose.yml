# Postgres with pgvector for the production-shaped index. Port 5434 on the host avoids
# clashing with a local Postgres. Then: RAG_DATABASE_URL=postgresql://rag:rag@localhost:5434/rag
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 2s
      retries: 20
